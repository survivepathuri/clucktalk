name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      include_macos:
        description: "Also run the macOS job (uses about 50 quota minutes per run)"
        type: boolean
        default: false

permissions:
  contents: read

env:
  MOCK_BEDROCK: "true"
  CLUCKTALK_NO_BROWSER: "1"

jobs:
  check:
    name: check (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # the secret scan needs a real git checkout
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - run: python tasks.py setup
      - run: python tasks.py check

  check-macos:
    name: check (macos-latest, Python 3.13)
    if: github.event_name == 'workflow_dispatch' && inputs.include_macos
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - run: python tasks.py setup
      - run: python tasks.py check

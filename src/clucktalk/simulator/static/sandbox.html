<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="color-scheme" content="light dark">
<title>Card sandbox</title>
<!-- MCP Apps sandbox proxy (spec 2026-01-26). Served on a different origin from the Simulator page, with a CSP
     header built from the card's declared _meta.ui.csp. The card is written into an inner iframe and inherits it. -->
<style>
  html, body { margin: 0; height: 100%; width: 100%; background: transparent; overflow: hidden; }
  iframe { display: block; border: 0; width: 100%; height: 100%; background: transparent; }
</style>
</head>
<body>
<script src="/static/sandbox.js"></script>
</body>
</html>

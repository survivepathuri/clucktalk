<!doctype html>
<html lang="te">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CluckTalk</title>
<link rel="stylesheet" href="/static/pilot.css">
</head>
<body>
<header class="top">
  <strong class="name">CluckTalk · @APP_NAME_TE@</strong>
  <span class="badge" id="badge" role="note"><span lang="te">@BADGE_TE@</span><small>@BADGE_EN@</small></span>
</header>
<p class="bubble warn fatal" id="fatal" lang="te" hidden>@OPEN_LINK_TE@<br><small>@OPEN_LINK_EN@</small></p>

<section class="card" id="notice-screen" hidden>
  <h2 id="notice-title"></h2>
  <ul id="notice-list"></ul>
  <button type="button" class="big yes" id="ack"></button>
</section>

<main id="app" hidden>
  <div class="log" id="log" aria-live="polite"></div>

  <section class="card" id="readback" hidden aria-live="assertive">
    <h2 id="readback-head"></h2>
    <p id="readback-text" lang="te"></p>
    <div class="pair">
      <button type="button" class="big yes" id="yes"></button>
      <button type="button" class="big yes" id="add" hidden></button>
      <button type="button" class="big yes" id="replace" hidden></button>
      <button type="button" class="big no" id="no"></button>
    </div>
  </section>

  <section class="card" id="picker" hidden>
    <h2 id="picker-title"></h2>
    <div class="grid" id="picker-body"></div>
  </section>

  <div class="chips" id="chips"></div>

  <form class="ask" id="ask" autocomplete="off">
    <input id="text" name="text" type="text" lang="te" inputmode="text" enterkeyhint="send">
    <button type="submit" class="send" id="send"></button>
  </form>
</main>
<script src="/static/pilot.js"></script>
</body>
</html>
